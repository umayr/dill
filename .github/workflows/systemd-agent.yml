name: Linux systemd agent packaging

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-verify:
    name: Static verification (no boot)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Test packaging assertions
        run: python3 -B -m unittest discover -s scripts -p test_check_systemd_agent.py -v
      - name: Build the matching combined Linux CLI
        run: make build
      - name: Verify the unit and env example without starting the agent
        run: python3 -B scripts/check_systemd_agent.py bin/dill
