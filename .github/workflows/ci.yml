name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Pkl
        run: |
          python3 scripts/install-pkl.py "$RUNNER_TEMP/pkl"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Check gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
      - name: Check pkl fmt
        run: |
          find . -name "*.pkl" -not -path "./.git/*" | while read f; do
            orig=$(cat "$f")
            pkl format -w "$f"
            if [ "$(cat "$f")" != "$orig" ]; then
              echo "$f is not pkl-formatted"
              exit 1
            fi
          done

  vet:
    name: Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make vet

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make build build-import build-serve

  macos-offline:
    name: Offline build and tests / macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make build build-import build-serve
      - run: make test

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Provision protected synthetic secret fixtures
        run: sudo install -d -m 0700 -o "$(id -u)" -g "$(id -g)" /srv/dill-secretfile-tests
      - name: Verify recovery from snapshot filesystem exhaustion
        run: |
          mount=$(mktemp -d)
          sudo mount -t tmpfs -o "size=2m,mode=0700,uid=$(id -u),gid=$(id -g)" tmpfs "$mount"
          trap 'sudo umount "$mount" && rmdir "$mount"' EXIT
          DILL_TEST_SMALL_TMPFS="$mount" go test ./internal/projectsnapshot -run '^TestSmallFilesystemAdmissionRecovers$' -count=1 -v
      - run: make test
        env:
          DILL_TEST_SECRET_DIR: /srv/dill-secretfile-tests
      - name: Diagnose synthetic workspace and protected-source qualification
        if: ${{ !cancelled() }}
        env:
          DILL_TEST_SECRET_DIR: /srv/dill-secretfile-tests
        run: go test -tags containers_image_openpgp,exclude_graphdriver_devicemapper,exclude_graphdriver_btrfs -run 'TestWorkspaceAncestryQualification|TestSourceMetadata$' -v ./internal/secretfile
      - name: Test metadata-only access without source read permission
        if: ${{ !cancelled() }}
        run: |
          CGO_ENABLED=0 go test -tags containers_image_openpgp,exclude_graphdriver_devicemapper,exclude_graphdriver_btrfs -c -o "$RUNNER_TEMP/secretfile.test" ./internal/secretfile
          sudo "$RUNNER_TEMP/secretfile.test" -test.run '^TestSourceMetadataWithoutReadPermission$' -test.v

  integration-docker:
    name: Integration / Docker
    runs-on: ubuntu-latest
    steps:
      - name: Independently provision trusted native Docker identity for functional integration
        run: |
          # This literal trusted-host step precedes checkout, source scripts,
          # builds, binary version probes, and all candidate/test execution.
          set -euo pipefail
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted
          test "$(uname -s)" = Linux
          test ! -e /.dockerenv
          test ! -e /run/.containerenv
          test -x /usr/bin/docker
          sudo systemctl is-active --quiet docker
          daemon_pid=$(sudo systemctl show docker --property MainPID --value)
          [[ "$daemon_pid" =~ ^[1-9][0-9]*$ ]]
          test "$daemon_pid" -gt 1
          test "$(sudo stat -c %u "/proc/$daemon_pid")" = 0
          IFS= read -r daemon_comm < "/proc/$daemon_pid/comm"
          test "$daemon_comm" = dockerd
          test -S /var/run/docker.sock
          test "$(stat -c %u /var/run/docker.sock)" = 0
          # Native in the SAME guest and namespaces, not Docker Desktop,
          # a different VM, a namespace-separated client, or a proxy layout.
          for namespace in user pid mnt net; do
            caller_ns=$(readlink "/proc/$$/ns/$namespace")
            daemon_ns=$(sudo readlink "/proc/$daemon_pid/ns/$namespace")
            test -n "$caller_ns"
            test "$caller_ns" = "$daemon_ns"
          done
          umask 077
          trusted_home=$(mktemp -d "$RUNNER_TEMP/dill-alpha-trusted.XXXXXXXX")
          mkdir -m 700 "$trusted_home/docker"
          printf '%s\n' '{"auths":{}}' > "$trusted_home/docker/config.json"
          # No ambient context, proxy, auth helpers, TLS selector or endpoint.
          daemon_id=$(/usr/bin/env -i PATH=/usr/bin:/bin HOME="$trusted_home" \
            DOCKER_CONFIG="$trusted_home/docker" /usr/bin/docker \
            --config "$trusted_home/docker" --host unix:///var/run/docker.sock \
            info --format '{{.ID}}')
          [[ "$daemon_id" =~ ^[A-Za-z0-9][A-Za-z0-9:-]{7,127}$ ]]
          state_root=$(mktemp -d "$RUNNER_TEMP/dill-alpha-state.XXXXXXXX")
          chmod 700 "$state_root"
          test "$(stat -c %a "$state_root")" = 700
          test "$(stat -c %u "$state_root")" = "$(id -u)"
          printf '::add-mask::%s\n' "$daemon_id"
          printf 'DILL_ALPHA_EXPECTED_DAEMON_ID=%s\n' "$daemon_id" >> "$GITHUB_ENV"
          printf 'DILL_ALPHA_STATE_ROOT=%s\n' "$state_root" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Pkl
        run: |
          python3 scripts/install-pkl.py "$RUNNER_TEMP/pkl"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/pkl" --version
      - name: Verify Docker
        run: docker version
      - name: Verify journal recovery after process death following an engine mutation
        env:
          DILL_TEST_DISPOSABLE_CRASH: "1"
        run: go test -tags containers_image_openpgp,exclude_graphdriver_devicemapper,exclude_graphdriver_btrfs ./internal/agentcmd -run '^TestCrashAfterDockerEffect$' -count=1 -v
      - name: Qualify image lock across tag movement on a disposable engine
        env:
          IMAGE_LOCK_PILOT_DISPOSABLE_DOCKER: "yes"
        run: make build && bash scripts/image-lock-pilot.sh
      - name: Run integration tests
        env:
          DILL_TEST_ENGINE: docker
          DILL_TEST_TIMEOUT: 2m
        run: make integration-test
      - name: Exercise operation envelope, qualified coordination, named preflight, recovery and no-prune
        env:
          DILL_TEST_ENGINE: docker
          DILL_TEST_TIMEOUT: 2m
          DILL_ENGINE_SOCKET: unix:///var/run/docker.sock
          DILL_TEST_ALPHA_COORDINATION: "1"
          DILL_TEST_ALPHA_OPERATIONS: "1"
          DILL_TEST_ALPHA_GUARDRAILS: "1"
          DILL_TEST_ALPHA_NATIVE_LAYOUT: native-local-docker-v1
          DILL_TEST_ALPHA_DAEMON_ID: ${{ env.DILL_ALPHA_EXPECTED_DAEMON_ID }}
          DILL_TEST_ALPHA_STATE_ROOT: ${{ env.DILL_ALPHA_STATE_ROOT }}
          DILL_PKL_PATH: ${{ runner.temp }}/pkl
        run: |
          go test -tags containers_image_openpgp,exclude_graphdriver_devicemapper,exclude_graphdriver_btrfs,integration ./test/integration -count=1 -v -timeout 30m -run '^TestAlpha(Qualified(StandalonePreflight|ForeignOwnership|OrphanRejection|PodmanRejected|Handlers|DockerProfile|ActualLivePreflight|SameStackConcurrency|AliasConcurrency|DifferentStackConcurrency|CrashUnknownRecovery|CorruptJournal|NamedPreflight(FiveRoutes|MismatchBeforeEnsure|StoreSelectorBinding|LockCancellation|EmptyAndOrphans|MetadataRefusal))|NoPruneBothEngines|OperationEnvelopeConformance)$'
      - name: Dump Docker state on failure
        if: failure()
        run: |
          docker version || true
          docker info || true
          docker ps -a || true
          docker images || true
          docker volume ls || true
          docker network ls || true

  integration-podman:
    name: Integration / Podman
    # Keep the verified rootless baseline explicit. Ubuntu 26.04 / Podman 5.7
    # currently fails network-process cleanup with permission denied, including
    # direct podman rm. Do not suppress lifecycle errors to accommodate it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Pkl and Podman
        run: |
          python3 scripts/install-pkl.py "$RUNNER_TEMP/pkl"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/pkl" --version
          sudo apt-get update
          sudo apt-get install -y podman
          podman version
      - name: Start Podman API socket
        run: |
          rm -f /tmp/dill-podman.sock
          podman system service --time=0 unix:///tmp/dill-podman.sock &
          for i in $(seq 1 30); do
            [ -S /tmp/dill-podman.sock ] && exit 0
            sleep 1
          done
          echo "Podman socket did not appear" >&2
          exit 1
      - name: Run integration tests
        env:
          DILL_TEST_ENGINE: podman
          PODMAN_SOCKET: unix:///tmp/dill-podman.sock
          DILL_TEST_TIMEOUT: 2m
        run: make integration-test
      - name: Exercise operation envelope and ordinary no-prune preservation
        env:
          DILL_TEST_ENGINE: podman
          DILL_ENGINE_SOCKET: unix:///tmp/dill-podman.sock
          DILL_TEST_ALPHA_OPERATIONS: "1"
          DILL_TEST_ALPHA_GUARDRAILS: "1"
          DILL_PKL_PATH: ${{ runner.temp }}/pkl
        run: go test -tags containers_image_openpgp,exclude_graphdriver_devicemapper,exclude_graphdriver_btrfs,integration ./test/integration -count=1 -v -run '^TestAlpha(NoPruneBothEngines|OperationEnvelopeConformance)$'
      - name: Dump Podman state on failure
        if: failure()
        run: |
          podman version || true
          podman info || true
          podman ps -a || true
          podman images || true
          podman volume ls || true
          podman network ls || true

  schema:
    name: Validate Schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pkl
        run: |
          python3 scripts/install-pkl.py "$RUNNER_TEMP/pkl"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/pkl" --version
      - name: Package
        run: make validate

  examples:
    name: Validate Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pkl
        run: |
          python3 scripts/install-pkl.py "$RUNNER_TEMP/pkl"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/pkl" --version
      - name: Eval examples
        run: |
          for f in examples/**/compose.pkl; do
            [ -f "$f" ] || continue
            echo "eval $f"
            pkl eval "$f" > /dev/null
          done
